<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c1d95">
<title>Curly Gurl Fitness</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#4c1d95;color:#f8f5ff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;font-size:16px;line-height:1.45}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 36px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Didot,Georgia,serif;font-size:28px;font-weight:600;letter-spacing:.01em;line-height:1.15;color:#fff}
.login{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.85);color:#1c1430;text-decoration:none;border-radius:8px;padding:12px 16px;font-weight:800;font-size:15px}
.lead{margin:0 0 18px;color:#f3e8ff;font-size:16px}
h2{margin:0 0 8px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Didot,Georgia,serif;font-size:26px;font-weight:600;color:#fff;letter-spacing:.01em}
.card{background:#fff;color:#1c1430;border-radius:16px;box-shadow:0 12px 28px rgba(40,0,60,.18);padding:12px;margin:0 0 12px}
.card p{margin:0;color:#1c1430;font-size:15px;line-height:1.45}
.shots{display:flex;flex-direction:column;gap:12px;margin:8px 0 28px}
.shots img{width:100%;height:180px;object-fit:cover;border-radius:12px;display:block;background:#efeaf6}
.shots figcaption{margin-top:8px;font-weight:800;font-size:14px}
section{margin:0 0 28px}
.welcome-close{display:flex;align-items:center;gap:10px;margin:8px 0 0;padding:0;background:transparent}
.creator-frame{width:112px;height:112px;border-radius:50%;overflow:hidden;flex:none;position:relative;background:#fff}
.welcome-close img.creator{position:absolute;width:132px;height:180px;max-width:none;left:-34px;top:10px;object-fit:fill;border-radius:0}
.welcome-quote{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.welcome-close img.script{width:auto;height:84px;max-width:100%;object-fit:contain;object-position:left center;background:transparent;border-radius:0}
.welcome-sign{display:block;height:15px;width:auto;margin:0;background:transparent}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Curly Gurl Fitness</h1>
      <a class="login" href="index.html">Log in</a>
    </header>
    <p class="lead">Classes, community, and the tracker for members. Log in opens the fitness tracker. This page is not a second diary.</p>
    <section>
      <h2>Classes</h2>
      <div class="shots">
        <figure class="card">
          <img src="images/welcome-rooftop.jpg" alt="Curly Gurl class on the roof">
          <figcaption>Class together</figcaption>
        </figure>
        <figure class="card">
          <img src="images/work/lower-body.jpg" alt="Class training">
          <figcaption>Training</figcaption>
        </figure>
        <figure class="card">
          <img src="images/library-step.jpg" alt="Step class">
          <figcaption>Step class</figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>Shop</h2>
      <div class="card">
        <p>The shop is not open. There is nothing for sale here, and there is no checkout.</p>
      </div>
    </section>
    <section class="welcome-close">
      <div class="creator-frame">
        <img class="creator" src="images/creator.jpg" alt="Marquita Foster">
      </div>
      <div class="welcome-quote">
        <img class="script" src="images/welcome-script.png" alt="Curly Gurl Fitness isn't just a brand, it's a family. Trainers, clients, and anyone walking in for the first time, you have a place here. Welcome home. That is Curly Gurl Fitness.">
        <img class="welcome-sign" src="images/marquita-foster.png" alt="Marquita Foster">
      </div>
    </section>
  </div>
</body>
</html>
